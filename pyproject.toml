[project]
name = "voice-agent-mini"
version = "0.1.0"
description = "A minimal security test harness for a voice agent, proven against a reference agent with five switchable guards"
requires-python = ">=3.10"
dependencies = []

[build-system]                              # installs mini/, so it imports from any folder or editor button
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3"]      # pytest-xdist: run the tests in parallel with: uv run pytest -n auto

[tool.pytest.ini_options]
testpaths = ["tests", "mini"]
pythonpath = ["."]
addopts = "--doctest-modules -m 'not naive'"   # NAIVE-002 is red by design: left out unless run with -m naive
markers = ["naive: every guard off, the attacks turn red by design; run it on purpose with -m naive"]
