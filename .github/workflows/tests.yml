# Runs on every push and pull request: any failing test blocks the merge.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -v
      - run: uv run python -m mini.runner data/attacks.jsonl --json results.json
